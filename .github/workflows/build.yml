name: APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: |
          for f in *.zip; do if [ -f "$f" ]; then unzip -q -o "$f"; fi; done
          if [ -d PilzKarte ]; then cd PilzKarte; fi
          if [ ! -d app ]; then echo "Noch keine PilzKarte.zip hochgeladen"; exit 0; fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PilzKarte.apk"
      - name: APK veroeffentlichen
        if: hashFiles('PilzKarte.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: PilzKarte.apk
